<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Kinalsbook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg border-0 rounded-lg">
                    <div class="card-body p-5">
                        <h3 class="text-center fw-bold mb-4 text-primary">Bienvenido</h3>
                        
                        <div id="alert-error" class="alert alert-danger d-none"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label text-muted">Usuario o Correo</label>
                                <input type="text" id="identifier" class="form-control form-control-lg" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-muted">Contraseña</label>
                                <input type="password" id="password" class="form-control form-control-lg" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 btn-lg">Ingresar</button>
                        </form>
                        <div class="text-center mt-3">
                            <small class="text-muted">¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
