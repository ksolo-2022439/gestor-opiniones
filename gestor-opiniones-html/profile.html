<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil Kinalsbook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="dashboard.html">Kinalsbook</a>
            <div class="d-flex">
                <a href="dashboard.html" class="btn btn-outline-light btn-sm me-2">Volver al Muro</a>
                <button onclick="logout()" class="btn btn-outline-light btn-sm">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-white border-0 pt-4 px-4">
                        <h4 class="fw-bold text-primary">Editar Perfil</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <div id="profile-alert" class="alert d-none"></div>

                        <form id="profileForm" class="mb-5">
                            <h5 class="text-muted mb-3 border-bottom pb-2">Datos Personales</h5>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" id="profileName" class="form-control">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Apellido</label>
                                    <input type="text" id="profileSurname" class="form-control">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" id="profileUsername" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                        </form>

                        <form id="passwordForm">
                            <h5 class="text-muted mb-3 border-bottom pb-2">Seguridad</h5>
                            <div class="alert alert-warning py-2">
                                <small>Para cambiar tu contraseña, debes ingresar la actual.</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Contraseña Actual</label>
                                <input type="password" id="oldPassword" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Nueva Contraseña</label>
                                <input type="password" id="newPassword" class="form-control" required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-danger">Actualizar Contraseña</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/profile.js"></script>
    <script>
        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
