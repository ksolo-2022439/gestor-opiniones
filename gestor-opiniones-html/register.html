<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Kinalsbook</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex align-items-center min-vh-100 bg-light">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg border-0 rounded-lg my-5">
                    <div class="card-body p-5">
                        <h3 class="text-center fw-bold mb-4 text-primary">Crear Cuenta</h3>
                        
                        <div id="register-alert" class="alert d-none"></div>

                        <form id="registerForm">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" id="regName" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Apellido</label>
                                    <input type="text" id="regSurname" class="form-control" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Usuario</label>
                                <input type="text" id="regUsername" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" id="regEmail" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Teléfono (8 dígitos)</label>
                                <input type="text" id="regPhone" class="form-control" required maxlength="8" minlength="8">
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Contraseña (Mín. 6 caracteres)</label>
                                <input type="password" id="regPassword" class="form-control" required minlength="6">
                            </div>

                            <button type="submit" class="btn btn-success w-100 btn-lg">Registrarse</button>
                        </form>
                        <div class="text-center mt-3">
                            <small class="text-muted">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
